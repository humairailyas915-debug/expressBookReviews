apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: test-and-build
spec:
  workspaces:
    - name: source
  steps:
    - name: npminstall
      image: node:16-alpine
      workingDir: $(workspaces.source.path)
      script: npm install
    - name: tests
      image: node:16-alpine
      workingDir: $(workspaces.source.path)
      script: npx jasmine
    - name: build
      image: gcr.io/kaniko-project/executor:latest
      script: /kaniko/executor --context=$(workspaces.source.path)
